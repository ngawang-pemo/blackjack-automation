# SOLUTION FOR STEP 5: only the "on:" block of .github/workflows/ci.yml changes.
# Replace the "on:" block of your ci.yml with this one. The jobs stay exactly the same.

name: CI

on:
  # Event trigger: run on every push to main or to any strategy branch
  push:
    branches: [main, "strategy-*", broken]
  # Event trigger: run on every pull request
  pull_request:
  # Button trigger: adds a "Run workflow" button in the Actions tab
  workflow_dispatch:
  # Time trigger: run every day at 07:00 UTC, even if nobody pushed anything.
  # Same cron format as the CronJob. GitHub may start it a few minutes late.
  # Scheduled runs only work on the default branch (main).
  schedule:
    - cron: "0 7 * * *"
